<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gkz room · WebTransport</title>
<style>
  :root { color-scheme: dark; --bg:#0b0d10; --fg:#e6e8eb; --dim:#8b949e; --accent:#7ee787; --line:#1c2128; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0; font-weight:600; }
  .dim { color:var(--dim); }
  main { padding:18px; display:grid; gap:18px; grid-template-columns:minmax(320px,1fr) minmax(280px,380px); }
  @media (max-width:820px) { main { grid-template-columns:1fr; } }
  canvas { width:100%; height:auto; background:#05070a; border:1px solid var(--line); border-radius:6px; image-rendering:pixelated; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:0; }
  dt { color:var(--dim); }
  dd { margin:0; }
  .ok { color:var(--accent); } .bad { color:#ff7b72; }
  pre { margin:0; padding:10px; background:#05070a; border:1px solid var(--line); border-radius:6px; max-height:220px; overflow:auto; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>gkz room</h1>
  <span class="dim" id="conn">connecting</span>
  <span class="dim" id="agree">—</span>
</header>
<main>
  <section>
    <canvas id="view" width="320" height="200"></canvas>
    <p class="dim">Arrow keys or WASD move. Every keypress is one Command on the room's input channel.</p>
  </section>
  <section>
    <dl>
      <dt>room</dt><dd id="room">—</dd>
      <dt>source</dt><dd id="source">—</dd>
      <dt>tick</dt><dd id="tick">—</dd>
      <dt>server digest</dt><dd id="server-digest">—</dd>
      <dt>tab digest</dt><dd id="tab-digest">—</dd>
      <dt>members</dt><dd id="members">—</dd>
      <dt>log</dt><dd id="logbytes">—</dd>
      <dt>presence</dt><dd id="presence">—</dd>
    </dl>
    <h2 style="font-size:13px;margin:16px 0 6px" class="dim">events</h2>
    <pre id="events"></pre>
  </section>
</main>
<script type="module">
const ui = {};
for (const id of ["conn","agree","room","source","tick","server-digest","tab-digest","members","logbytes","presence","events","view"]) {
  ui[id] = document.getElementById(id);
}
// Element ids are dashed, so the map is the only accessor: ui["server-digest"], never a camelCase name.

const events = [];
function log(channel, text) {
  events.push(channel + "  " + text);
  if (events.length > 200) events.shift();
  ui.events.textContent = events.slice(-40).join("\n");
}

// Fetched and instantiated from bytes rather than streamed: a module served without the
// `application/wasm` content type is refused by `instantiateStreaming`, and a WebAssembly module whose
// bytes are already in hand needs no MIME to be instantiated.
const wasmBytes = await (await fetch("/room.wasm")).arrayBuffer();
const x = (await WebAssembly.instantiate(wasmBytes, {})).instance.exports;
const u64 = (v) => BigInt.asUintN(64, BigInt(v));

let session = null, writer = null, feedWriter = null;
let seed = 0, source = 0;

async function open() {
  session = new WebTransport(new URL("/room", location.origin));
  ui.conn.textContent = "dialing";
  await session.ready;
  ui.conn.textContent = "open";
  log("session", "ready (HTTP/3)");

  const control = await session.createBidirectionalStream();
  writer = control.writable.getWriter();
  void readControl(control.readable.getReader());
  void readPresence();

  session.closed.then(() => { ui.conn.textContent = "closed"; log("session", "closed"); })
                 .catch((err) => { ui.conn.textContent = "failed"; log("session", "closed: " + err); });
}

// The server frames two kinds of message on the stream: [1][len] JSON, [2][len] run-log INPUT records.
async function readControl(reader) {
  const decoder = new TextDecoder();
  let buf = new Uint8Array(0);
  const push = (chunk) => { const out = new Uint8Array(buf.length + chunk.length); out.set(buf); out.set(chunk, buf.length); buf = out; };
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      push(value);
      for (;;) {
        if (buf.length < 5) break;
        const len = new DataView(buf.buffer, buf.byteOffset).getUint32(1, true);
        if (buf.length < 5 + len) break;
        const payload = buf.slice(5, 5 + len);
        const tag = buf[0];
        buf = buf.slice(5 + len);
        if (tag === 1) handleJson(JSON.parse(decoder.decode(payload)));
        else if (tag === 2) applyRecords(payload);
      }
    }
  } catch (err) { log("stream", "ended: " + err); }
}

function applyRecords(payload) {
  // Each record is [u8 kind][u32 len][payload]; the client refuses a snapshot rather than accepting world
  // state from the wire, so the filter here mirrors the server's.
  const dv = new DataView(payload.buffer, payload.byteOffset, payload.byteLength);
  let p = 0;
  while (p + 5 <= payload.length) {
    const kind = payload[p];
    const len = dv.getUint32(p + 1, true);
    if (p + 5 + len > payload.length) break;
    if (kind === 1) {
      // The whole record, header included: `cl_apply` walks its inbox with the run-log reader, so what it
      // wants is exactly the bytes the host put on the wire, not the input frame inside them.
      const frame = payload.subarray(p, p + 5 + len);
      const inbox = x.in_reserve(frame.length);
      new Uint8Array(x.memory.buffer, inbox, frame.length).set(frame);
      // A refusal is a gap in the confirmed stream, a replay of something already applied, or world state on
      // the wire. Reporting it is the difference between "the view is behind" and "the view is wrong".
      if (x.cl_apply(frame.length) === 0) {
        const at = new DataView(payload.buffer, payload.byteOffset + p + 5, 8).getBigUint64(0, true);
        log("apply", "refused a record for tick " + at + " while at tick " + x.cl_tick());
      }
    }
    p += 5 + len;
  }
  refresh();
}

function handleJson(msg) {
  if (msg.type === "hello") {
    seed = msg.seed; source = msg.source;
    x.cl_init(seed);
    x.cl_set_source(source);
    ui.room.textContent = msg.room;
    ui.source.textContent = String(source);
    log("hello", "room " + msg.room + " seed " + seed + " source " + source);
  } else if (msg.type === "status") {
    ui.tick.textContent = String(msg.tick);
    ui["server-digest"].textContent = msg.digest;
    ui.members.textContent = String(msg.members);
    ui.logbytes.textContent = String(msg.logBytes);
    refresh();
  }
}

async function readPresence() {
  try {
    for await (const dg of session.datagrams.readable) {
      const dv = new DataView(dg.buffer, dg.byteOffset, dg.byteLength);
      if (dv.getUint8(0) !== 2) continue;
      const n = dv.getUint8(1);
      const parts = [];
      for (let i = 0; i < n; i++) {
        const at = 2 + i * 6;
        parts.push(dv.getUint8(at) + "@" + dv.getInt32(at + 1, true));
      }
      ui.presence.textContent = parts.length ? parts.join(" ") : "(alone)";
    }
  } catch (err) { log("datagrams", "ended: " + err); }
}

// Presence carries where this tab is looking. It is replaceable by definition, so it rides a datagram and is
// also the heartbeat that pulls the view forward.
setInterval(() => {
  if (!session || !session.datagrams) return;
  const w = session.datagrams.writable.getWriter();
  const dg = new Uint8Array(6);
  const dv = new DataView(dg.buffer);
  dv.setUint8(0, 1);
  dv.setInt32(1, x.cl_tick(), true);
  dv.setUint8(5, 0);
  w.write(dg).then(() => w.releaseLock()).catch(() => {});
}, 250);

const moves = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0], w:[0,-1], s:[0,1], a:[-1,0], d:[1,0] };
addEventListener("keydown", (e) => {
  const m = moves[e.key];
  if (!m || !writer) return;
  e.preventDefault();
  x.cl_predict(m[0], m[1]);
  writer.write(new Uint8Array([m[0] + 1, m[1] + 1])).catch(() => {});
  refresh();
});

function refresh() {
  ui["tab-digest"].textContent = String(u64(x.cl_digest()));
  const agree = u64(x.cl_digest()) === BigInt(ui["server-digest"].textContent || "-1");
  ui.agree.textContent = agree ? "digests agree ✓" : "catching up…";
  ui.agree.className = agree ? "ok" : "dim";
  draw();
}

function draw() {
  const live = x.cl_live();
  const n = x.cl_extent();
  const buf = new DataView(x.memory.buffer, x.cl_buf(), n * 4 * 4);
  const ctx = ui.view.getContext("2d");
  ctx.fillStyle = "#05070a";
  ctx.fillRect(0, 0, ui.view.width, ui.view.height);
  const sx = ui.view.width / 32, sy = ui.view.height / 20;
  for (let i = 0; i < live; i++) {
    const px = buf.getInt32(i * 16), py = buf.getInt32(i * 16 + 4);
    const hp = buf.getInt32(i * 16 + 8), team = buf.getInt32(i * 16 + 12);
    ctx.fillStyle = team === 0 ? "#7ee787" : hp > 0 ? "#ff7b72" : "#484f58";
    ctx.fillRect(px * sx, py * sy, sx, sy);
  }
}

// The module and the host-side handles, for scripted checks against a running page.
window.room = { x, u64, read: { tick: () => x.cl_tick(), confirmed: () => x.cl_confirmed(), digest: () => String(u64(x.cl_digest())), ptick: () => x.cl_ptick() }, session: () => session, log };

await open();
// A pull a few times a second keeps the confirmed stream flowing even when nobody moves.
setInterval(() => { if (writer) writer.write(new Uint8Array([0])).catch(() => {}); }, 400);
</script>
</body>
</html>
