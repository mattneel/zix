# A Fly.io deployment for the WebTransport demo, with a certificate browsers already trust.
#
# Two things here are not how a Fly app is usually configured, and both are required:
#
# - The services carry no `handlers`. Fly's edge proxy terminates TLS for any service that has them, which
#   turns the connection into plaintext inside their network. QUIC cannot survive that: the handshake has
#   to reach this process and end here, and starting from a WebTransport endpoint the browser never sends a
#   cleartext byte. With no handlers the proxy is a wire.
# - Port 80 is passed through as well, to certbot's standalone responder. A certificate the edge holds is
#   no use to a QUIC server - the handshake needs the private key - so the certificate is issued to this
#   machine. That is also why the app cannot live on a *.fly.dev hostname: nobody but Fly can issue a
#   certificate for a name they own, and this app has to hold the key.
#
# The UDP listener binds a numeric address: Fly requires UDP on `fly-global-services`, which
# deploy/entrypoint.sh resolves before starting the server. Set DOMAIN and ACME_EMAIL as secrets.

app = "zix-webtransport-demo"
primary_region = "iad"

# This lives at the repository root because Fly resolves `dockerfile` relative to this file and uses this
# file's directory as the build context: from deploy/ the sources would not be in the context at all.
[build]
  dockerfile = "deploy/Dockerfile"

[env]
  # One origin: the page is HTTPS/1.1 on TCP, the session is HTTP/3 on UDP, both inside on 9444.
  ZIX_PAGE_IP = "0.0.0.0"
  ZIX_PAGE_PORT = "9444"
  ZIX_SESSION_PORT = "9444"
  # The port a browser reaches this origin on. Alt-Svc has to name it, not the internal 9444: a browser told
  # ":9444" for an origin it knows as :443 tries a port nothing listens on and falls back to TCP.
  ZIX_PUBLIC_PORT = "443"

[[mounts]]
  source = "certs"
  destination = "/data"

# The page and the WebTransport session: one external port, both protocols passed straight through.
[[services]]
  internal_port = 9444
  protocol = "tcp"

  [[services.ports]]
    port = 443

[[services]]
  internal_port = 443
  protocol = "udp"

  [[services.ports]]
    port = 443

# Port 80 is deliberately absent until a certificate is being issued. certbot's standalone responder needs it
# for the ACME HTTP-01 challenge, but with no DOMAIN set nothing binds it, and an edge that finds no listener
# on a declared service refuses connections for the whole app rather than just that port. Add this block back
# at the same time as DOMAIN and ACME_EMAIL:
#
#   [[services]]
#     internal_port = 80
#     protocol = "tcp"
#
#     [[services.ports]]
#       port = 80

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Auto-stop is off on purpose. Fly decides a machine is idle from proxy traffic, and these services have no
# proxy: the passthrough that QUIC needs is also what makes the machine look idle while it is serving a live
# WebTransport session. A machine stopped mid-session drops every session on it.
[experimental]
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
